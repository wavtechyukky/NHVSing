# config_v3_2.yaml — training recipe for the V3.2 distributed weights (exported_models/v3_2).
#
# V3.2 = V3.1 + a fix for the high-pitch 1-period dropout ("歯抜け") plus a higher-resolution
# reconstruction. Only the deltas from config_v3_1.yaml matter:
#   - ltv_filter.ola_mode: hann      … Hann WOLA (window 2*hop, 50% overlap). The square OLA lets a
#                                       frame's filtered spillover cancel a whole glottal period in
#                                       anti-phase at high F0; the Hann taper removes it. The ONNX
#                                       export (export.py -> LTVFirONNX use_hann) is Hann too, so
#                                       train and deploy match.
#   - vocoder.excit_phase_jitter: true … train-only: randomise the impulse-train start phase per batch
#                                       so the CNN cannot memorise a fixed GCI phase (eval/ONNX use
#                                       phase 0). Also helps the dropout fix.
#   - higher-resolution STFT loss    … window_lengths gains 64 & 128; stft_loss_scale 2.5 -> 10,
#                                       mel_loss_scale 45 -> 30 (rebalance toward the multi-res STFT).
#   - feature_matching_scale 2 -> 0  … FM removed (it teaches filter-phase/GCI alignment = the dropout).
#   - envelope_scale 5 -> 2.5, adversarial_scale 1 -> 0.5, adversarial_start 100 -> 150.
#   - min_crop_rms 0.02              … reject near-silent random crops in the loader (gradient spikes).
#   - pitch_aug_prob 0.5 -> 1.0, amp_aug_range [0.1,2.0] -> [0.5,2.0].
#   - no adversarial_end / de-striping phase (D runs to the end).
# The shipped ep350 weights were trained with this config to ~ep300, then finished with a ~50-epoch
# polish at 1/5 learning rate (lr_g 8e-5, lr_d 4e-5, D:G ratio kept), pitch_aug still 1.0.
#
# Generator V3: mel-only input / white 200-harmonic excitation / quef_norm alpha=1.0 / uv hard gate /
# f0_upsample linear / weight_norm. For hop512 input (OpenUtau etc.) use ltv_filter.use_v3x: true.
# Training: MRD + MPD GAN (train.py). Data/output dirs are given on the command line / environment.

seed: 42
device: "cuda"

preprocess:
  sample_rate: 44100
  hop_size:    256
  fft_size:    2048
  win_size:    2048
  mel_dim:     128
  mel_min:     40.0
  mel_max:     16000.0
  mel_format:  'diffsinger'      # nvSTFT / pc-nsf compatible ln-mel (center=False, reflect pad (fft-hop)//2)
  target_rms:  0.111             # RMS-normalisation target for the training data
  # F0: stored as 0=unvoiced, linearly interpolated + turned into a uv flag at train time (dataset.norm_interp_f0)
  f0_extractor: 'rmvpe'
  f0_min:      40.0
  f0_max:      1200.0
  cut_wavs:
    silence_thresh:  -50.0
    min_silence_dur: 0.10
    max_dur:         30.0       # whole-utterance-ish (only long silences removed); length is managed by train-time crop
    long_silence:    0.5        # cut only at silences >= 0.5s
    pad:             0.10
  data_filtering:
    min_frames: 150
    max_frames: 99999

common_params: &common_params
  hop_size:      256
  in_channels:   128            # = mel_dim. Input width of the mel conv
  conv_channels: 256
  kernel_size:   3
  dilation_size: 1
  group_size:    8
  use_causal:    false

model:
  vocoder:
    <<: *common_params
    sample_rate:     44100
    noise_std:       0.03
    use_weight_norm: true
    f0_upsample:     linear     # smooth instantaneous frequency (sharper harmonics)
    n_harmonic:      200        # white 200-harmonic (flat amplitude, Nyquist soft mask)
    excit_phase_jitter: true    # ★train-only: randomise impulse start phase per batch (eval/ONNX = phase 0)

  ltv_filter:
    <<: *common_params
    ccep_size:       256
    ccep_size_noise: 256        # noise uses the same complex-cepstrum head as harmonic
    fft_size:        1024       # LTV cepstrum -> IR FFT (independent of the mel FFT; fft >= ccep)
    n_ltv_layers:    2          # per Liu2020 NHV (ConvLayers = input proj + 2 hidden + output proj)
    use_quef_norm:   true
    quef_norm_alpha: 1.0
    use_shared_trunk: true      # shared trunk (V2/V3)
    use_hard_vuv:    true       # uv hard gate
    use_v3:          true       # ← selects NHVSingV3 (final model). hop512 variant: use_v3x: true
    ola_mode:        hann       # ★Hann WOLA (fixes the high-pitch 1-period dropout). ONNX export matches.

discriminator:
  use_hifigan_disc: true
  discriminator_periods: [3, 5, 7, 11, 17, 23, 37]
  use_msd: false                # no MSD
  use_mpd: true                 # MPD (period/phase)
  use_mrd: true                 # MRD (UnivNet multi-resolution spectrogram magnitude)

training:
  # ── data / output (set to your own paths) ──
  train_dir: 'dataset/train'          # directory of npz training data
  test_dir:  'dataset/test'
  log_dir:      'logs_v3_2'
  snapshot_dir: 'snapshots_v3_2'
  inference_output_dir: 'dataset/inference'
  snapshot_path: None                 # ckpt to resume from (None = fresh training)
  max_samples_per_epoch: 999999       # max segments per epoch (set to the real segment count for one pass)
  gradient_accumulation_steps: 1
  shuffle: true
  save_interval: 10
  nan_restart_until_epoch: 10
  # ── disc (MRD) extra params ──
  reinit_disc: false
  r1_interval: 16                     # lazy R1 (when r1_gamma>0)
  adaptive_d_gate: false
  d_gate_floor: 0.35
  d_gate_ema: 0.98
  harmonic_penalty_scale: 0           # replaced by the uv hard gate in V3 (unused)
  # ── pitch augmentation ──
  pitch_aug: true
  pitch_aug_prob: 1.0                 # ★100% (keep the anti-phase-bias pressure; no un-augmented pass)
  pitch_aug_semitones: [-1.8, 1.8]
  # ── TensorBoard visualisation ──
  tb_log_uvoff: true
  tb_disc_badness: true
  tb_linear_spec: true
  # ── optimisation ──
  lr_g: 0.0004
  lr_d: 0.0002
  lr_d_grp2: 0.0002
  disc_beta1: 0.5               # GAN standard beta1=0.5 (avoids MRD sticking at d=0.5)
  disc_beta2: 0.9
  r1_gamma: 0                   # R1 off
  disc_grad_clip: 5.0
  disc_grad_clip_grp2: 5.0
  gen_grad_clip: 200.0
  crop_frames: 64               # 64*256 = 16384 samp ~= 372ms random crop
  min_crop_rms: 0.02            # ★reject near-silent crops in the loader (0 = disabled)
  batch_size: 256
  num_workers: 4
  amp_augment: true
  amp_aug_range: [0.5, 2.0]
  vuv_dropout_prob: 1.0         # drop the uv gate during training (learn to suppress unvoiced from mel); active only at inference
  adversarial_start: 150
  adversarial_warmup_epochs: 20
  # loss weights
  mel_loss_scale: 30            # magnitude mel loss (phase-invariant)
  stft_loss_scale: 10           # multi-res STFT magnitude (phase-invariant); raised for higher resolution
  stft_loss_type: 'nsf'
  adversarial_scale: 0.5        # distributional, phase-tolerant (MPD + MRD)
  feature_matching_scale: 0     # ★off: FM teaches filter-phase/GCI alignment = the dropout cause
  grp2_loss_weight: 1.0
  envelope_scale: 2.5
  envelope_start: 200
  envelope_kernel_size: 1024
  envelope_stride: 128
  envelope_directional: true
  use_amp: true
  amp_dtype: bfloat16
  n_epoch: 351                  # base config ran to ~ep300; the shipped ep350 adds a ~50-epoch 1/5-LR polish
  # multi-res STFT bands (NSF-style); 64 & 128 added for higher resolution
  window_lengths: [64, 128, 256, 512, 1024, 1536, 2048, 3072, 4096]
