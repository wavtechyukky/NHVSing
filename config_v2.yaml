# config_v2.yaml — example config for NHVSing V2 (NHVSingV2)
# Edit paths and parameters to match your dataset and environment.
#
# Key V2 features enabled here:
#   - Shared trunk CNN (use_shared_trunk: true)
#   - F0 embedder (use_f0_embed: true, 256 bins log2 scale)
#   - Quefrency normalization (use_quef_norm: true, alpha=0.3)
#   - Amplitude augmentation (amp_augment: true)
#   - F0 extraction: RMVPE (auto-downloaded on first run)

seed: 42
device: "cuda"

preprocess:
  # Paths — edit these to match your dataset location
  raw_wav_dir:      'dataset/raw'
  resample_wav_dir: 'dataset/wav_44100'
  cut_wav_dir:      'dataset/cut_wav'
  f0_img_dir:       'dataset/f0_imgs'
  npz_dir:          'dataset/npz'
  prefix: "singer"

  # Audio settings
  sample_rate: 44100
  scale: 1.0
  frame_size: 256
  target_rms: 0.083   # RMS normalization target (M4Singer median). Set null to disable.

  # F0 extraction
  # rmvpe: neural F0 estimator (recommended for V2, auto-downloaded on first run)
  # harvest: pyworld-based estimator (V1 compatible, requires pyworld)
  f0_extractor: 'rmvpe'   # harvest | rmvpe
  # For rmvpe: wide range is fine (40–1200 Hz covers all singing voices).
  # For harvest: narrow to the singer's range for better accuracy.
  #   Male:   f0_min: 50.0,  f0_max: 700.0
  #   Female: f0_min: 150.0, f0_max: 800.0  (raise f0_max if very high notes are present)
  f0_min: 40.0
  f0_max: 1200.0

  # Silent-cut settings
  cut_wavs:
    silence_thresh: -50.0
    min_silence_dur: 0.10
    max_dur: 9.0
    long_silence: 1.0
    pad: 0.10

  # Mel spectrogram settings
  fft_size: 4096
  hop_size: 256
  mel_dim: 128
  mel_min: 40.0
  mel_max: 22050.0

  # Data filtering
  data_filtering:
    min_frames: 150
    max_frames: 2500
    backup_dir: 'dataset/npz_backup'

  # Train/test split
  train_test_split:
    train: 100
    test: 1

# Shared anchor (referenced in model sections below)
common_params: &common_params
  hop_size: 256
  in_channels: 128
  conv_channels: 256
  kernel_size: 3
  dilation_size: 1
  group_size: 8
  use_causal: false

model:
  vocoder:
    <<: *common_params
    sample_rate: 44100
    noise_std: 0.03
    use_weight_norm: true
    conv_type: "original"

  ltv_filter:
    <<: *common_params
    ccep_size: 512
    ccep_size_noise: 512
    fft_size: 1024
    use_zero_mask: true
    conv_type: "original"
    conv_channels: 512
    n_ltv_layers: 2
    in_channels: 256        # 128 mel + 128 F0 embed
    use_f0_embed: true
    f0_embed_bins: 256
    f0_embed_dim: 128
    f0_embed_fmin: 40.0
    f0_embed_fmax: 1200.0
    use_quef_norm: true
    quef_norm_alpha: 0.3
    use_shared_trunk: true

discriminator:
  use_msd: true
  stft_filters: 16

training:
  train_dir: 'dataset/training/train'
  test_dir:  'dataset/training/test'
  log_dir:      'logs_v2'
  snapshot_dir: 'snapshots_v2'
  lr_g: 0.0001
  lr_d: 0.0002
  batch_size: 8
  gradient_accumulation_steps: 8  # effective batch size = 64
  shuffle: True
  num_workers: 2
  max_samples_per_epoch: 1000
  amp_augment: true
  amp_aug_range: [0.5, 2.0]
  adversarial_start: 100
  adversarial_scale: 4
  adversarial_warmup_epochs: 50
  feature_matching_scale: 1
  envelope_start: 1000
  envelope_scale: 0
  harmonic_penalty_start: 100
  harmonic_penalty_scale: 100
  use_amp: true
  save_interval: 10
  n_epoch: 901
  nan_restart_until_epoch: 10
  snapshot_path: None
  inference_output_dir: 'dataset/inference'
  window_lengths:
    - 256
    - 512
    - 768
    - 1024
    - 1280
    - 1536
    - 1792
    - 2048
    - 3072
    - 4096
    - 6144
    - 8192
