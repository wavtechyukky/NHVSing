# config_v3_3.yaml — training recipe for the V3.3 distributed weights (exported_models/v3_3, = ep1320).
#
# V3.3 = V3 with an auxiliary harmonic/noise loss from hnsep, trained in three stages in one run.
#
#   epochs    0–1000 : the V3.2 recipe unchanged (same settings as config_v3_2.yaml, constant lr)
#   epochs 1001–1300 : + hnsep component mel losses (hn_loss_start: 1000)
#   epochs 1301–1320 : polish, every learning rate x0.1 (polish_start: 1300, polish_lr_scale: 0.1)
#
# hnsep component mel losses: the harmonic branch (sig_harm) is pulled toward the mel of the harmonic part
# that an external harmonic–noise separator (hnsep) finds in the training audio, and the noise branch
# (sig_noise) toward the mel of the rest (wav − harmonic). The weights are small next to the main mel loss
# (30), so the separator is a hint, not a target: where it disagrees with the whole-signal losses, they win.
# Effect in listening: the harmonic branch loses some of its hard, pulse-like edge, and fricatives keep more
# of their energy above 6 kHz.
#
# The training data must carry the harmonic part from the start (even though the loss only switches on at
# epoch 1001): run tools/add_hnsep_harmonic.py on the preprocessed npz files once. With
# hn_harmonic_mel_scale = hn_noise_mel_scale = 0 (the default) the 'harmonic' key is never read.
#
# Both schedule switches look at the epoch number, so resuming from any snapshot puts you in the right stage
# (e.g. resume from a V3.2-recipe ep1000 snapshot with --resume_path to run only the last two stages).
#
#   python train_v3.py --config config_v3_3.yaml
#
# Generator V3: mel-only input / white 200-harmonic excitation / quef_norm alpha=1.0 / uv hard gate /
# f0_upsample linear / weight_norm. Training: MRD + MPD GAN.

seed: 42
device: "cuda"

preprocess:
  sample_rate: 44100
  hop_size:    256
  fft_size:    2048
  win_size:    2048
  mel_dim:     128
  mel_min:     40.0
  mel_max:     16000.0
  mel_format:  'diffsinger'      # nvSTFT / pc-nsf compatible ln-mel (center=False, reflect pad (fft-hop)//2)
  target_rms:  0.111             # RMS-normalisation target for the training data
  # F0: stored as 0=unvoiced, linearly interpolated + turned into a uv flag at train time (dataset.norm_interp_f0)
  f0_extractor: 'rmvpe'
  f0_min:      40.0
  f0_max:      1200.0
  cut_wavs:
    silence_thresh:  -50.0
    min_silence_dur: 0.10
    max_dur:         30.0       # whole-utterance-ish (only long silences removed); length is managed by train-time crop
    long_silence:    0.5        # cut only at silences >= 0.5s
    pad:             0.10
  data_filtering:
    min_frames: 150
    max_frames: 99999

common_params: &common_params
  hop_size:      256
  in_channels:   128            # = mel_dim. Input width of the mel conv
  conv_channels: 256
  kernel_size:   3
  dilation_size: 1
  group_size:    8
  use_causal:    false

model:
  vocoder:
    <<: *common_params
    sample_rate:     44100
    noise_std:       0.03
    use_weight_norm: true
    f0_upsample:     linear     # smooth instantaneous frequency (sharper harmonics)
    n_harmonic:      200        # white 200-harmonic (flat amplitude, Nyquist soft mask)
    excit_phase_jitter: true    # train-only: randomise impulse start phase per batch (eval/ONNX = phase 0)

  ltv_filter:
    <<: *common_params
    ccep_size:       256
    ccep_size_noise: 256        # noise uses the same complex-cepstrum head as harmonic
    fft_size:        1024       # LTV cepstrum -> IR FFT (independent of the mel FFT; fft >= ccep)
    n_ltv_layers:    2          # per Liu2020 NHV (ConvLayers = input proj + 2 hidden + output proj)
    use_quef_norm:   true
    quef_norm_alpha: 1.0
    use_shared_trunk: true      # shared trunk (V2/V3)
    use_hard_vuv:    true       # uv hard gate
    use_v3:          true       # selects NHVSingV3 (final model). hop512 variant: use_v3x: true
    ola_mode:        hann       # Hann WOLA (fixes the high-pitch 1-period dropout). ONNX export matches.

discriminator:
  use_hifigan_disc: true
  discriminator_periods: [3, 5, 7, 11, 17, 23, 37]
  use_msd: false                # no MSD
  use_mpd: true                 # MPD (period/phase)
  use_mrd: true                 # MRD (UnivNet multi-resolution spectrogram magnitude)

training:
  # ── data / output (set to your own paths) ──
  train_dir: 'dataset/train'          # npz training data WITH the hnsep harmonic (tools/add_hnsep_harmonic.py)
  test_dir:  'dataset/test'
  log_dir:      'logs_v3_3'
  snapshot_dir: 'snapshots_v3_3'
  inference_output_dir: 'dataset/inference'
  snapshot_path: None                 # ckpt to resume from (None = fresh training)
  max_samples_per_epoch: 999999       # max segments per epoch (set to the real segment count for one pass)
  gradient_accumulation_steps: 1
  shuffle: true
  save_interval: 10
  nan_restart_until_epoch: 10
  # ── disc (MRD) extra params ──
  reinit_disc: false
  r1_interval: 16                     # lazy R1 (when r1_gamma>0)
  adaptive_d_gate: false
  d_gate_floor: 0.35
  d_gate_ema: 0.98
  harmonic_penalty_scale: 0           # replaced by the uv hard gate in V3 (unused)
  # ── pitch augmentation ──
  pitch_aug: true
  pitch_aug_prob: 1.0                 # 100% (keep the anti-phase-bias pressure; no un-augmented pass)
  pitch_aug_semitones: [-1.8, 1.8]
  # ── TensorBoard visualisation ──
  tb_log_uvoff: true
  tb_disc_badness: true
  tb_linear_spec: true
  # ── optimisation ──
  lr_g: 0.0004                  # stages 1–2. The polish stage multiplies all three by polish_lr_scale
  lr_d: 0.0002
  lr_d_grp2: 0.0002
  disc_beta1: 0.5               # GAN standard beta1=0.5 (avoids MRD sticking at d=0.5)
  disc_beta2: 0.9
  r1_gamma: 0                   # R1 off
  disc_grad_clip: 5.0
  disc_grad_clip_grp2: 5.0
  gen_grad_clip: 200.0
  crop_frames: 64               # 64*256 = 16384 samp ~= 372ms random crop
  min_crop_rms: 0.02            # reject near-silent crops in the loader (0 = disabled)
  batch_size: 256
  num_workers: 4
  amp_augment: true
  amp_aug_range: [0.5, 2.0]
  vuv_dropout_prob: 1.0         # drop the uv gate during training (learn to suppress unvoiced from mel); active only at inference
  adversarial_start: 150
  adversarial_warmup_epochs: 20
  # loss weights
  mel_loss_scale: 30            # magnitude mel loss (phase-invariant)
  hn_harmonic_mel_scale: 2      # ★hnsep: sig_harm -> mel of the hnsep harmonic (1/15 of the main mel loss)
  hn_noise_mel_scale: 1         # ★hnsep: sig_noise -> mel of (wav - harmonic) (half: lower level, less reliable)
  hn_loss_start: 1000           # ★hnsep losses on for epochs > 1000
  stft_loss_scale: 10           # multi-res STFT magnitude (phase-invariant)
  stft_loss_type: 'nsf'
  adversarial_scale: 0.5        # distributional, phase-tolerant (MPD + MRD)
  feature_matching_scale: 0     # off: FM teaches filter-phase/GCI alignment = the dropout cause
  grp2_loss_weight: 1.0
  envelope_scale: 2.5
  envelope_start: 200
  envelope_kernel_size: 1024
  envelope_stride: 128
  envelope_directional: true
  use_amp: true
  amp_dtype: bfloat16
  polish_start: 1300            # ★polish: epochs > 1300 run at lr x polish_lr_scale (G and D together, keeps the GAN balance)
  polish_lr_scale: 0.1
  n_epoch: 1321                 # epochs 0–1320
  # multi-res STFT bands (NSF-style)
  window_lengths: [64, 128, 256, 512, 1024, 1536, 2048, 3072, 4096]
